# Build, test, pack and push NewSettlement.SettlClient.* packages
# to the Azure Artifacts feed `NewSettlement`.
#
# Versioning: Directory.Build.props har VersionPrefix (fx 0.6.0).
# CI tilføjer VersionSuffix=preview.{BuildId} så hver commit publishes som
# 0.6.0-preview.{BuildId} — unik per build, ingen konflikter, consumers kan
# floate til seneste preview via Version="0.6.*-*".
#
# Triggers på develop + master. Commit-direkte-til-develop er normalflow;
# develop CI publisher seneste preview til feed med det samme — ingen
# lokal-vs-CI gap for consumers. Feature branches kun ved store, sjældne
# ændringer (tilfj branchen midlertidigt til include-listen hvis behov).

trigger:
  branches:
    include:
      - master
      - develop

pr: none

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  feedName: 'Verdo Agile Development/NewSettlement'

steps:
  - task: UseDotNet@2
    displayName: 'Install .NET 9.0'
    inputs:
      version: '9.0.x'
      includePreviewVersions: false

  - task: NuGetAuthenticate@1
    displayName: 'Authenticate to Azure Artifacts'

  - task: DotNetCoreCLI@2
    displayName: 'Restore'
    inputs:
      command: 'restore'
      projects: '**/*.csproj'
      feedsToUse: 'config'
      nugetConfigPath: 'nuget.config'

  - task: DotNetCoreCLI@2
    displayName: 'Build'
    inputs:
      command: 'build'
      projects: 'NewSettlement.SettlClient.slnx'
      arguments: '--configuration $(buildConfiguration) --no-restore'

  - task: DotNetCoreCLI@2
    displayName: 'Test'
    inputs:
      command: 'test'
      projects: 'NewSettlement.SettlClient.slnx'
      arguments: '--configuration $(buildConfiguration) --no-build'
      publishTestResults: true

  - task: DotNetCoreCLI@2
    displayName: 'Pack (VersionSuffix=preview.$(Build.BuildId))'
    inputs:
      command: 'pack'
      packagesToPack: 'src/**/*.csproj'
      configuration: '$(buildConfiguration)'
      packDirectory: '$(Build.ArtifactStagingDirectory)/packages'
      nobuild: true
      includesymbols: false
      buildProperties: 'VersionSuffix=preview.$(Build.BuildId)'

  - powershell: |
      Get-ChildItem "$(Build.ArtifactStagingDirectory)/packages/*.nupkg" | ForEach-Object { Write-Host $_.Name }
    displayName: 'List packages'

  - task: NuGetCommand@2
    displayName: 'Push to feed'
    inputs:
      command: 'push'
      packagesToPush: '$(Build.ArtifactStagingDirectory)/packages/*.nupkg'
      nuGetFeedType: 'internal'
      publishVstsFeed: '$(feedName)'
      # allowPackageConflicts NEDARVET FRA TIDLIGERE MODEL — IKKE NØDVENDIG.
      # BuildId garanterer unik version per commit; en konflikt indikerer et reelt bug.
      allowPackageConflicts: false

  - publish: '$(Build.ArtifactStagingDirectory)/packages'
    artifact: nupkgs
    displayName: 'Upload packages as build artifact'
