# CI for library NuGets (DataMigration.Migration + DataMigration.OpsCli).
# Service deploys lever i azure-pipelines.yml — pack+push sker KUN her.
#
# Versioning: Directory.Build.props har VersionPrefix (0.1.0).
# CI tilfojer VersionSuffix=preview.{BuildId} -> 0.1.0-preview.{BuildId}
# (unik per commit, ingen konflikter).

trigger:
  branches:
    include:
      - master
  paths:
    include:
      - src/DataMigration.Migration.Library/**
      - src/DataMigration.OpsCli.Library/**
      - src/Tests/**
      - Directory.Build.props
      - nuget.config
      - DataMigration.sln
      - azure-pipelines-libs.yml

pr: none

jobs:
  - job: PackAndPush
    displayName: 'Build, test, pack & push library NuGets'
    pool:
      vmImage: 'windows-latest'
    timeoutInMinutes: 20
    steps:
      - task: UseDotNet@2
        displayName: 'Install .NET 9.0'
        inputs:
          version: '9.0.x'
          includePreviewVersions: false

      - task: NuGetAuthenticate@1
        displayName: 'Authenticate to Azure Artifacts'

      - task: DotNetCoreCLI@2
        displayName: 'Restore NuGet packages'
        inputs:
          command: 'restore'
          projects: 'DataMigration.sln'
          feedsToUse: 'config'
          nugetConfigPath: 'nuget.config'

      - task: DotNetCoreCLI@2
        displayName: 'Build solution'
        inputs:
          command: 'build'
          projects: 'DataMigration.sln'
          # VersionSuffix skal sættes HER (ikke kun på pack): pack kører --no-build, så
          # assemblyens AssemblyInformationalVersion bages ind ved dette build-step. Uden
          # suffixet her får DLL'en default 'dev' selvom pakke-versionen bliver preview.{BuildId}
          # — og fx Dashboard.Api's /api/version (der læser InformationalVersion) viser så -dev.
          arguments: '--configuration Release --no-restore /p:VersionSuffix=preview.$(Build.BuildId)'

      - task: DotNetCoreCLI@2
        displayName: 'Run tests'
        inputs:
          command: 'test'
          projects: 'DataMigration.sln'
          arguments: '--configuration Release --no-build'
          publishTestResults: true

      - powershell: |
          $artifact = "$(Build.ArtifactStagingDirectory)"
          dotnet pack src/DataMigration.Migration.Library/DataMigration.Migration.Library.csproj `
            -c Release --no-build -o "$artifact/nuget" `
            /p:VersionSuffix=preview.$(Build.BuildId)
          dotnet pack src/DataMigration.OpsCli.Library/DataMigration.OpsCli.Library.csproj `
            -c Release --no-build -o "$artifact/nuget" `
            /p:VersionSuffix=preview.$(Build.BuildId)
        displayName: 'Pack library NuGets'

      - task: NuGetCommand@2
        displayName: 'Push library NuGets'
        inputs:
          command: 'push'
          packagesToPush: '$(Build.ArtifactStagingDirectory)/nuget/*.nupkg'
          nuGetFeedType: 'internal'
          publishVstsFeed: 'Verdo Agile Development/NewSettlement'
          # BuildId garanterer unik version per commit; konflikt = reelt bug.
          allowPackageConflicts: false
